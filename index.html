<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Database</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            color: #bbb;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .search-box {
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #111;
        }

        .status {
            margin: 15px 0;
            color: #666;
        }

        .artists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .artist-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e5e5e5;
        }

        .artist-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .artist-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #ddd;
        }

        .artist-card-content {
            padding: 15px;
        }

        .artist-card h3 {
            margin: 0;
            font-size: 18px;
        }

        .artist-info {
            display: none;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .back-button:hover {
            background: #333;
        }

        .artist-header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 35px;
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .artist-header img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            background: #ddd;
        }

        .artist-header h2 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .artist-header p {
            margin: 5px 0;
            color: #666;
        }

        .release-section {
            margin-bottom: 45px;
        }

        .release-section h3 {
            font-size: 24px;
            margin-bottom: 18px;
            border-bottom: 2px solid #111;
            padding-bottom: 10px;
        }

        .releases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .release-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #e5e5e5;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .release-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .release-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #ddd;
        }

        .release-card-content {
            padding: 13px;
        }

        .release-card h4 {
            margin: 0 0 7px;
            font-size: 16px;
        }

        .release-card p {
            margin: 3px 0;
            font-size: 13px;
            color: #666;
        }

        .release-details {
            background: white;
            border-radius: 12px;
            padding: 30px;
        }

        .release-main {
            display: flex;
            gap: 30px;
            margin-bottom: 35px;
        }

        .release-main img {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
            background: #ddd;
        }

        .release-main h2 {
            margin-top: 0;
            font-size: 30px;
        }

        .release-meta p {
            margin: 8px 0;
            color: #555;
        }

        .tracklist h3 {
            border-bottom: 2px solid #111;
            padding-bottom: 10px;
        }

        .track {
            display: grid;
            grid-template-columns: 45px 1fr 80px;
            gap: 10px;
            padding: 12px 5px;
            border-bottom: 1px solid #eee;
        }

        .track-number {
            color: #888;
        }

        .track-duration {
            text-align: right;
            color: #666;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {
            .artist-header,
            .release-main {
                flex-direction: column;
            }

            .artist-header img,
            .release-main img {
                width: 100%;
                height: auto;
                max-width: 280px;
            }

            .artist-header h2 {
                font-size: 26px;
            }

            .release-main h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Music Database</h1>
    <p>Artists, albums, singles, live albums and compilations</p>
</header>

<div class="container">

    <section id="artistsView">

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Cerca un artista..."
            >
        </div>

        <div id="status" class="status">
            Caricamento artisti...
        </div>

        <div id="artistsGrid" class="artists-grid"></div>

    </section>


    <section id="artistView" class="hidden">

        <button class="back-button" onclick="showArtists()">
            ← Torna agli artisti
        </button>

        <div id="artistHeader"></div>

        <div id="releasesContainer"></div>

    </section>


    <section id="releaseView" class="hidden">

        <button class="back-button" onclick="backToArtist()">
            ← Torna alla discografia
        </button>

        <div id="releaseDetails"></div>

    </section>

</div>


<script>

const SUPABASE_URL =
    "https://rueoqgbqvaumqdexhmtl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Dhram7JGseCL4JJeGavFQQ_N0UHxwum";


let allArtists = [];
let currentArtist = null;


/* =========================
   SUPABASE REQUEST
========================= */

async function supabaseFetch(endpoint) {

    const response = await fetch(
        SUPABASE_URL + endpoint,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        }
    );

    if (!response.ok) {
        throw new Error(
            "Errore Supabase: " +
            response.status +
            " " +
            await response.text()
        );
    }

    return await response.json();
}


/* =========================
   ARTISTI
========================= */

async function loadArtists() {

    const status =
        document.getElementById("status");

    try {

        allArtists = await supabaseFetch(
            "/rest/v1/artists?select=*&order=name.asc"
        );

        renderArtists(allArtists);

        status.textContent =
            `${allArtists.length} artisti`;

    } catch (error) {

        console.error(error);

        status.textContent =
            "Errore nel caricamento degli artisti.";
    }
}


function renderArtists(artists) {

    const grid =
        document.getElementById("artistsGrid");

    grid.innerHTML = "";

    if (!artists.length) {

        grid.innerHTML =
            "<p>Nessun artista trovato.</p>";

        return;
    }

    artists.forEach(artist => {

        const card =
            document.createElement("div");

        card.className =
            "artist-card";

        card.onclick = () =>
            showArtist(artist);

        const image =
            artist.image_url ||
            "https://via.placeholder.com/500?text=Artist";

        card.innerHTML = `
            <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(artist.name)}"
            >

            <div class="artist-card-content">

                <h3>
                    ${escapeHtml(artist.name)}
                </h3>

            </div>
        `;

        grid.appendChild(card);
    });
}


/* =========================
   RICERCA
========================= */

document
    .getElementById("searchInput")
    .addEventListener("input", function() {

        const query =
            this.value
                .toLowerCase()
                .trim();

        const filtered =
            allArtists.filter(artist =>
                String(artist.name || "")
                    .toLowerCase()
                    .includes(query)
            );

        renderArtists(filtered);

        document.getElementById("status")
            .textContent =
            `${filtered.length} artisti`;
    });


/* =========================
   ARTISTA
========================= */

async function showArtist(artist) {

    currentArtist = artist;

    document
        .getElementById("artistsView")
        .classList.add("hidden");

    document
        .getElementById("releaseView")
        .classList.add("hidden");

    document
        .getElementById("artistView")
        .classList.remove("hidden");


    const header =
        document.getElementById("artistHeader");

    const image =
        artist.image_url ||
        "https://via.placeholder.com/500?text=Artist";


    header.innerHTML = `
        <div class="artist-header">

            <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(artist.name)}"
            >

            <div>

                <h2>
                    ${escapeHtml(artist.name)}
                </h2>

                ${
                    artist.country
                    ? `<p><strong>Paese:</strong> ${escapeHtml(artist.country)}</p>`
                    : ""
                }

                ${
                    artist.area
                    ? `<p><strong>Area:</strong> ${escapeHtml(artist.area)}</p>`
                    : ""
                }

                ${
                    artist.gender
                    ? `<p><strong>Genere:</strong> ${escapeHtml(artist.gender)}</p>`
                    : ""
                }

                ${
                    artist.birth_date
                    ? `<p><strong>Nascita:</strong> ${escapeHtml(artist.birth_date)}</p>`
                    : ""
                }

                ${
                    artist.birth_place
                    ? `<p><strong>Luogo di nascita:</strong> ${escapeHtml(artist.birth_place)}</p>`
                    : ""
                }

                ${
                    artist.disambiguation
                    ? `<p>${escapeHtml(artist.disambiguation)}</p>`
                    : ""
                }

            </div>

        </div>
    `;


    const container =
        document.getElementById("releasesContainer");

    container.innerHTML =
        "<p class='status'>Caricamento discografia...</p>";


    try {

        const releases =
            await supabaseFetch(
                "/rest/v1/releases" +
                "?select=*" +
                "&artist_id=eq." +
                encodeURIComponent(artist.id) +
                "&order=release_date.asc.nullslast,title.asc"
            );


        renderReleases(releases);

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Errore nel caricamento della discografia.</p>";
    }
}


/* =========================
   DISCOGRAFIA
========================= */

function renderReleases(releases) {

    const container =
        document.getElementById("releasesContainer");

    container.innerHTML = "";


    const albums =
        releases.filter(release =>
            String(release.release_type || "")
                .toLowerCase() === "album"
        );


    const singles =
        releases.filter(release =>
            String(release.release_type || "")
                .toLowerCase() === "single"
        );


    const live =
        releases.filter(release =>
            String(release.release_type || "")
                .toLowerCase() === "live"
        );


    const compilations =
        releases.filter(release =>
            String(release.release_type || "")
                .toLowerCase() === "compilation"
        );


    renderReleaseSection(
        container,
        "Album",
        albums
    );


    renderReleaseSection(
        container,
        "Singoli",
        singles
    );


    renderReleaseSection(
        container,
        "Live",
        live
    );


    renderReleaseSection(
        container,
        "Compilation",
        compilations
    );
}


/* =========================
   SEZIONE RELEASE
========================= */

function renderReleaseSection(
    container,
    title,
    releases
) {

    if (!releases.length) {
        return;
    }


    const section =
        document.createElement("section");

    section.className =
        "release-section";


    const heading =
        document.createElement("h3");

    heading.textContent =
        `${title} (${releases.length})`;


    section.appendChild(heading);


    const grid =
        document.createElement("div");

    grid.className =
        "releases-grid";


    releases.forEach(release => {

        const card =
            document.createElement("div");

        card.className =
            "release-card";

        card.onclick = () =>
            showRelease(release);


        const image =
            release.cover_url ||
            "https://via.placeholder.com/500?text=No+Cover";


        let date = "";

        if (release.release_date) {

            date =
                String(release.release_date)
                    .substring(0, 10);
        }


        card.innerHTML = `

            <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(release.title)}"
            >

            <div class="release-card-content">

                <h4>
                    ${escapeHtml(release.title)}
                </h4>

                ${
                    date
                    ? `<p>${escapeHtml(date)}</p>`
                    : ""
                }

                ${
                    release.label
                    ? `<p>${escapeHtml(release.label)}</p>`
                    : ""
                }

            </div>
        `;


        grid.appendChild(card);
    });


    section.appendChild(grid);

    container.appendChild(section);
}


/* =========================
   RELEASE DETTAGLI
========================= */

async function showRelease(release) {

    document
        .getElementById("artistView")
        .classList.add("hidden");

    document
        .getElementById("releaseView")
        .classList.remove("hidden");


    const container =
        document.getElementById("releaseDetails");


    container.innerHTML =
        "<p>Caricamento release...</p>";


    try {

        const tracks =
            await supabaseFetch(
                "/rest/v1/tracks" +
                "?select=*" +
                "&release_id=eq." +
                encodeURIComponent(release.id) +
                "&order=disc_number.asc.nullslast,track_number.asc.nullslast,id.asc"
            );


        renderReleaseDetails(
            release,
            tracks
        );

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Errore nel caricamento della tracklist.</p>";
    }
}


/* =========================
   DETTAGLI + TRACKLIST
========================= */

function renderReleaseDetails(
    release,
    tracks
) {

    const container =
        document.getElementById("releaseDetails");


    const image =
        release.cover_url ||
        "https://via.placeholder.com/500?text=No+Cover";


    let date = "";

    if (release.release_date) {

        date =
            String(release.release_date)
                .substring(0, 10);
    }


    let html = `

        <div class="release-details">

            <div class="release-main">

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(release.title)}"
                >

                <div>

                    <h2>
                        ${escapeHtml(release.title)}
                    </h2>

                    <div class="release-meta">

                        ${
                            release.release_type
                            ? `<p><strong>Tipo:</strong> ${escapeHtml(release.release_type)}</p>`
                            : ""
                        }

                        ${
                            date
                            ? `<p><strong>Data:</strong> ${escapeHtml(date)}</p>`
                            : ""
                        }

                        ${
                            release.country
                            ? `<p><strong>Paese:</strong> ${escapeHtml(release.country)}</p>`
                            : ""
                        }

                        ${
                            release.label
                            ? `<p><strong>Label:</strong> ${escapeHtml(release.label)}</p>`
                            : ""
                        }

                        ${
                            release.catalog_number
                            ? `<p><strong>Catalogo:</strong> ${escapeHtml(release.catalog_number)}</p>`
                            : ""
                        }

                    </div>

                </div>

            </div>


            <div class="tracklist">

                <h3>
                    Tracklist
                </h3>
    `;


    if (!tracks.length) {

        html += `
            <p>
                Nessuna tracklist disponibile.
            </p>
        `;

    } else {

        let currentDisc = null;


        tracks.forEach(track => {

            const disc =
                track.disc_number || 1;


            if (
                currentDisc !== null &&
                disc !== currentDisc
            ) {

                html += `
                    <div style="height:15px;"></div>
                `;
            }


            currentDisc = disc;


            const trackNumber =
                track.track_number || "";


            const duration =
                formatDuration(track.duration);


            html += `

                <div class="track">

                    <div class="track-number">
                        ${escapeHtml(String(trackNumber))}
                    </div>

                    <div>
                        ${escapeHtml(track.title || "")}
                    </div>

                    <div class="track-duration">
                        ${escapeHtml(duration)}
                    </div>

                </div>
            `;
        });
    }


    html += `

            </div>

        </div>
    `;


    container.innerHTML = html;
}


/* =========================
   DURATA
========================= */

function formatDuration(duration) {

    if (!duration) {
        return "";
    }

    return String(duration);
}


/* =========================
   TORNA AGLI ARTISTI
========================= */

function showArtists() {

    document
        .getElementById("artistView")
        .classList.add("hidden");

    document
        .getElementById("releaseView")
        .classList.add("hidden");

    document
        .getElementById("artistsView")
        .classList.remove("hidden");

    currentArtist = null;
}


/* =========================
   TORNA ALL'ARTISTA
========================= */

function backToArtist() {

    document
        .getElementById("releaseView")
        .classList.add("hidden");

    document
        .getElementById("artistView")
        .classList.remove("hidden");
}


/* =========================
   SICUREZZA HTML
========================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   AVVIO
========================= */

loadArtists();

</script>

</body>
</html>
