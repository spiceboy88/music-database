<body>


<header>

    <p>

    </p>

            type="text"
            placeholder="Cerca artista..."
        >

</header>


<main id="main">

    <section class="section">

        <h2 class="section-title">
            Artisti
        </h2>

        <div
            id="artists"
            class="cards"
        >

            <p class="loading">
                Caricamento artisti...
            </p>

        </div>

    </section>

</main>


<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://rueoqgbqvaumqdexhmtl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_Dhram7JGseCL4JJeGavFQQ_N0UHxwum";


/* =========================================================
   ELEMENTI
========================================================= */

const main =
    document.getElementById("main");


const searchInput =
    document.getElementById("searchInput");


/* =========================================================
   HEADERS
========================================================= */

function headers() {

    return {

        "apikey": SUPABASE_KEY,

        "Authorization":
            `Bearer ${SUPABASE_KEY}`

    };

}


/* =========================================================
   SICUREZZA HTML
========================================================= */

function escapeHtml(text) {

    return String(text ?? "")

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


/* =========================================================
   DURATA
========================================================= */

function formatDuration(ms) {

    if (!ms) {
        return "";
    }

    const totalSeconds =
        Math.floor(ms / 1000);


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        String(
            totalSeconds % 60
        ).padStart(2, "0");


    return `${minutes}:${seconds}`;

}


/* =========================================================
   CARICA ARTISTI
========================================================= */

async function loadArtists(search = "") {

    const artistsContainer =
        document.getElementById("artists");


    if (!artistsContainer) {
        return;
    }


    artistsContainer.innerHTML =
        '<p class="loading">Caricamento...</p>';


    let url =
        `${SUPABASE_URL}/rest/v1/artists?select=*&order=name.asc`;


    if (search.trim() !== "") {

        url +=
            `&name=ilike.*${encodeURIComponent(search)}*`;

    }


    try {

        const response =
            await fetch(
                url,
                {
                    headers: headers()
                }
            );


        if (!response.ok) {

            throw new Error(
                "Errore nella connessione a Supabase"
            );

        }


        const artists =
            await response.json();


        artistsContainer.innerHTML = "";


        if (artists.length === 0) {

            artistsContainer.innerHTML =
                '<p class="empty">Nessun artista trovato.</p>';

            return;

        }


        artists.forEach(
            artist => {

                const card =
                    document.createElement("div");


                card.className =
                    "card artist-card";


                card.innerHTML = `

                    ${
                        artist.image_url
                        ?
                        `
                        <img
                            src="${escapeHtml(
                                artist.image_url
                            )}"
                            alt="${escapeHtml(
                                artist.name
                            )}"
                        >
                        `
                        :
                        ""
                    }

                    <h3>
                        ${escapeHtml(
                            artist.name
                        )}
                    </h3>

                    <p>
                        ${escapeHtml(
                            artist.disambiguation ||
                            "Artist"
                        )}
                    </p>

                `;


                card.addEventListener(
                    "click",
                    () => loadArtistPage(
                        artist.id
                    )
                );


                artistsContainer.appendChild(
                    card
                );

            }
        );

    }


    catch (error) {

        artistsContainer.innerHTML =
            `
            <p class="error">
                ${escapeHtml(
                    error.message
                )}
            </p>
            `;

    }

}


/* =========================================================
   PAGINA ARTISTA
========================================================= */

async function loadArtistPage(artistId) {

    main.innerHTML =
        '<p class="loading">Caricamento artista...</p>';


    try {

        /* -------------------------------------------------
           ARTISTA
        ------------------------------------------------- */

        const artistResponse =
            await fetch(

                `${SUPABASE_URL}/rest/v1/artists?id=eq.${artistId}&select=*`,

                {
                    headers: headers()
                }

            );


        if (!artistResponse.ok) {

            throw new Error(
                "Errore nel caricamento dell'artista"
            );

        }


        const artists =
            await artistResponse.json();


        if (!artists.length) {

            main.innerHTML =
                "<p>Artista non trovato.</p>";

            return;

        }


        const artist =
            artists[0];


        /* -------------------------------------------------
           TUTTE LE RELEASE
        ------------------------------------------------- */

        const releasesResponse =
            await fetch(

                `${SUPABASE_URL}/rest/v1/releases?artist_id=eq.${artist.id}&select=*&order=release_date.asc`,

                {
                    headers: headers()
                }

            );


        if (!releasesResponse.ok) {

            throw new Error(
                "Errore nel caricamento delle release"
            );

        }


        const releases =
            await releasesResponse.json();


        /* -------------------------------------------------
           DIVISIONE ALBUM / SINGOLI
        ------------------------------------------------- */

        const albums =
            releases.filter(
                release =>
                    String(
                        release.release_type || ""
                    ).toLowerCase() === "album"
            );


        const singles =
            releases.filter(
                release =>
                    String(
                        release.release_type || ""
                    ).toLowerCase() === "single"
            );


        /* -------------------------------------------------
           PAGINA
        ------------------------------------------------- */

        main.innerHTML = `

            <div
                class="back"
                onclick="goHome()"
            >
                ← Torna agli artisti
            </div>


            <section class="section">

                <h2>
                    ${escapeHtml(
                        artist.name
                    )}
                </h2>

                <div class="artist-description">

                    ${
                        artist.disambiguation
                        ?
                        `
                        <p>
                            ${escapeHtml(
                                artist.disambiguation
                            )}
                        </p>
                        `
                        :
                        ""
                    }

                </div>

            </section>


            <!-- ================================
                 ALBUM
            ================================= -->

            <section class="section">

                <h2 class="section-title">
                    Album
                </h2>

                <div
                    id="albums"
                    class="cards"
                ></div>

            </section>


            <!-- ================================
                 SINGOLI
            ================================= -->

            <section class="section">

                <h2 class="section-title">
                    Singoli
                </h2>

                <div
                    id="singles"
                    class="cards"
                ></div>

            </section>

        `;


        /* =================================================
           GRIGLIA ALBUM
        ================================================= */

        const albumsContainer =
            document.getElementById(
                "albums"
            );


        if (albums.length === 0) {

            albumsContainer.innerHTML =
                `
                <p class="empty">
                    Nessun album trovato.
                </p>
                `;

        }


        else {

            albums.forEach(
                release => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card";


                    card.innerHTML = `

                        ${
                            release.cover_url
                            ?
                            `
                            <img
                                src="${escapeHtml(
                                    release.cover_url
                                )}"
                                alt="${escapeHtml(
                                    release.title
                                )}"
                            >
                            `
                            :
                            ""
                        }


                        <h3>
                            ${escapeHtml(
                                release.title
                            )}
                        </h3>


                        <p>
                            ${escapeHtml(
                                release.release_date ||
                                ""
                            )}
                        </p>

                    `;


                    card.addEventListener(
                        "click",
                        () => loadReleasePage(
                            release.id
                        )
                    );


                    albumsContainer.appendChild(
                        card
                    );

                }
            );

        }


        /* =================================================
           GRIGLIA SINGOLI
        ================================================= */

        const singlesContainer =
            document.getElementById(
                "singles"
            );


        if (singles.length === 0) {

            singlesContainer.innerHTML =
                `
                <p class="empty">
                    Nessun singolo trovato.
                </p>
                `;

        }


        else {

            singles.forEach(
                single => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card";


                    card.innerHTML = `

                        ${
                            single.cover_url
                            ?
                            `
                            <img
                                src="${escapeHtml(
                                    single.cover_url
                                )}"
                                alt="${escapeHtml(
                                    single.title
                                )}"
                            >
                            `
                            :
                            ""
                        }


                        <h3>
                            ${escapeHtml(
                                single.title
                            )}
                        </h3>


                        <p>
                            ${escapeHtml(
                                single.release_date ||
                                ""
                            )}
                        </p>

                    `;


                    /*
                     * I singoli sono anch'essi
                     * release, quindi possono
                     * aprire la stessa pagina
                     * dettagliata degli album.
                     */

                    card.addEventListener(
                        "click",
                        () => loadReleasePage(
                            single.id
                        )
                    );


                    singlesContainer.appendChild(
                        card
                    );

                }
            );

        }

    }


    catch (error) {

        main.innerHTML =
            `
            <p class="error">
                ${escapeHtml(
                    error.message
                )}
            </p>
            `;

    }

}


/* =========================================================
   PAGINA RELEASE
========================================================= */

async function loadReleasePage(releaseId) {

    main.innerHTML =
        '<p class="loading">Caricamento release...</p>';


    try {

        /* -------------------------------------------------
           RELEASE
        ------------------------------------------------- */

        const releaseResponse =
            await fetch(

                `${SUPABASE_URL}/rest/v1/releases?id=eq.${releaseId}&select=*`,

                {
                    headers: headers()
                }

            );


        if (!releaseResponse.ok) {

            throw new Error(
                "Errore nel caricamento della release"
            );

        }


        const releases =
            await releaseResponse.json();


        if (!releases.length) {

            main.innerHTML =
                "<p>Release non trovata.</p>";

            return;

        }


        const release =
            releases[0];


        /* -------------------------------------------------
           TRACKLIST
        ------------------------------------------------- */

        const tracksResponse =
            await fetch(

                `${SUPABASE_URL}/rest/v1/tracks?release_id=eq.${release.id}&select=*&order=disc_number.asc,track_number.asc`,

                {
                    headers: headers()
                }

            );


        if (!tracksResponse.ok) {

            throw new Error(
                "Errore nel caricamento della tracklist"
            );

        }


        const tracks =
            await tracksResponse.json();


        /* -------------------------------------------------
           PAGINA RELEASE
        ------------------------------------------------- */

        main.innerHTML = `

            <div
                class="back"
                onclick="goBackToArtist(
                    ${release.artist_id}
                )"
            >
                ← Torna all'artista
            </div>


            <section class="section">


                <div class="album-header">


                    ${
                        release.cover_url
                        ?
                        `
                        <img
                            class="album-cover"
                            src="${escapeHtml(
                                release.cover_url
                            )}"
                            alt="${escapeHtml(
                                release.title
                            )}"
                        >
                        `
                        :
                        ""
                    }


                    <div class="album-info">


                        <h2>
                            ${escapeHtml(
                                release.title
                            )}
                        </h2>


                        ${
                            release.release_type
                            ?
                            `
                            <p>
                                Tipo:
                                ${escapeHtml(
                                    release.release_type
                                )}
                            </p>
                            `
                            :
                            ""
                        }


                        ${
                            release.release_date
                            ?
                            `
                            <p>
                                Data:
                                ${escapeHtml(
                                    release.release_date
                                )}
                            </p>
                            `
                            :
                            ""
                        }


                        ${
                            release.country
                            ?
                            `
                            <p>
                                Paese:
                                ${escapeHtml(
                                    release.country
                                )}
                            </p>
                            `
                            :
                            ""
                        }


                        ${
                            release.label
                            ?
                            `
                            <p>
                                Etichetta:
                                ${escapeHtml(
                                    release.label
                                )}
                            </p>
                            `
                            :
                            ""
                        }


                        ${
                            release.catalog_number
                            ?
                            `
                            <p>
                                Catalogo:
                                ${escapeHtml(
                                    release.catalog_number
                                )}
                            </p>
                            `
                            :
                            ""
                        }


                    </div>

                </div>


                <h2 class="section-title">
                    Tracklist
                </h2>


                <div class="tracklist">


                    ${
                        tracks.length
                        ?

                        tracks.map(
                            track => `

                                <div class="track">


                                    <div
                                        class="track-number"
                                    >
                                        ${escapeHtml(
                                            track.track_number
                                        )}
                                    </div>


                                    <div
                                        class="track-title"
                                    >
                                        ${escapeHtml(
                                            track.title
                                        )}
                                    </div>


                                    <div
                                        class="duration"
                                    >
                                        ${formatDuration(
                                            track.duration_ms
                                        )}
                                    </div>


                                </div>

                            `
                        ).join("")


                        :


                        `
                        <div class="track">

                            <div class="track-title">

                                Nessuna traccia
                                disponibile.

                            </div>

                        </div>
                        `

                    }


                </div>


            </section>

        `;

    }


    catch (error) {

        main.innerHTML =
            `
            <p class="error">
                ${escapeHtml(
                    error.message
                )}
            </p>
            `;

    }

}


/* =========================================================
   TORNA ALL'ARTISTA
========================================================= */

function goBackToArtist(artistId) {

    loadArtistPage(
        artistId
    );

}


/* =========================================================
   TORNA HOME
========================================================= */

function goHome() {

    window.history.pushState(
        {},
        "",
        window.location.pathname
    );


    main.innerHTML = `

        <section class="section">

            <h2 class="section-title">
                Artisti
            </h2>


            <div
                id="artists"
                class="cards"
            >

                <p class="loading">
                    Caricamento artisti...
                </p>

            </div>

        </section>

    `;


    loadArtists();

}


/* =========================================================
   RICERCA
========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        loadArtists(
            searchInput.value
        );

    }
);


/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const artistId =
    params.get("artist");


const releaseId =
    params.get("release");


if (releaseId) {

    loadReleasePage(
        releaseId
    );

}


else if (artistId) {

    loadArtistPage(
        artistId
    );

}


else {

    loadArtists();

}

</script>


</body>
</html>
