<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Database</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            padding: 60px 20px;
            text-align: center;
            background: #181818;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
        }

        .search {
            margin-top: 30px;
        }

        input {
            width: 80%;
            max-width: 600px;
            padding: 16px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        main {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section {
            margin-bottom: 50px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1d1d1d;
            padding: 25px;
            border-radius: 10px;
        }

        .card h3 {
            margin-top: 0;
        }

        .loading {
            color: #aaa;
        }

        .error {
            color: #ff7777;
        }
    </style>
</head>

<body>

<header>

    <h1>Music Database</h1>

    <p>
        Artists, albums, singles, releases, tracks and artwork
    </p>

    <div class="search">
        <input
            id="searchInput"
            type="text"
            placeholder="Cerca artista..."
        >
    </div>

</header>

<main>

    <section class="section">

        <h2>Artisti</h2>

        <div id="artists" class="cards">
            <p class="loading">Caricamento artisti...</p>
        </div>

    </section>

</main>

<script>

const SUPABASE_URL =
    "https://rueoqgbqvaumqdexhmtl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Dhram7JGseCL4JJeGavFQQ_N0UHxwum";

const artistsContainer =
    document.getElementById("artists");

const searchInput =
    document.getElementById("searchInput");


async function loadArtists(search = "") {

    artistsContainer.innerHTML =
        '<p class="loading">Caricamento...</p>';

    let url =
        `${SUPABASE_URL}/rest/v1/artists?select=*&order=name.asc`;

    if (search.trim() !== "") {

        url +=
            `&name=ilike.*${encodeURIComponent(search)}*`;

    }

    try {

        const response = await fetch(url, {

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
            }

        });

        if (!response.ok) {

            throw new Error(
                "Errore nella connessione a Supabase"
            );

        }

        const artists = await response.json();

        artistsContainer.innerHTML = "";

        if (artists.length === 0) {

            artistsContainer.innerHTML =
                "<p>Nessun artista trovato.</p>";

            return;
        }

        artists.forEach(artist => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.innerHTML = `
    <h3>
        <a href="?artist=${encodeURIComponent(artist.id)}"
           style="color:white;text-decoration:none;">
            ${escapeHtml(artist.name)}
        </a>
    </h3>

    <p>
        ${escapeHtml(
            artist.disambiguation || "Artist"
        )}
    </p>
`;

            artistsContainer.appendChild(card);

        });

    } catch (error) {

        artistsContainer.innerHTML =
            `<p class="error">${error.message}</p>`;

    }

}


function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


searchInput.addEventListener(
    "input",
    () => loadArtists(searchInput.value)
);


async function loadArtistPage(artistId) {

    const artistResponse = await fetch(
        `${SUPABASE_URL}/rest/v1/artists?id=eq.${artistId}&select=*`,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
            }
        }
    );

    const artists = await artistResponse.json();

    if (!artists.length) {
        return;
    }

    const artist = artists[0];

    const releasesResponse = await fetch(
        `${SUPABASE_URL}/rest/v1/releases?artist_id=eq.${artist.id}&select=*&order=release_date.asc`,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
            }
        }
    );

    const releases = await releasesResponse.json();

    document.querySelector("main").innerHTML = `
        <section class="section">

            <h2>${escapeHtml(artist.name)}</h2>

            <p>
                ${escapeHtml(
                    artist.disambiguation || ""
                )}
            </p>

            <div class="cards" id="releases"></div>

        </section>
    `;

    const releasesContainer =
        document.getElementById("releases");

    releases.forEach(release => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            ${
                release.cover_url
                ? `<img src="${release.cover_url}"
                        style="width:100%;border-radius:8px;margin-bottom:15px;">`
                : ""
            }

            <h3>
                ${escapeHtml(release.title)}
            </h3>

            <p>
                ${escapeHtml(
                    release.release_type || ""
                )}
            </p>

            <p>
                ${escapeHtml(
                    release.release_date || ""
                )}
            </p>
        `;

        releasesContainer.appendChild(card);

    });

}


const params =
    new URLSearchParams(window.location.search);

const artistId =
    params.get("artist");

if (artistId) {

    loadArtistPage(artistId);

} else {

    loadArtists();

}

</script>

</body>
</html>
