</main>

<script>

const SUPABASE_URL =
    "https://rueoqgbqvaumqdexhmtl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Dhram7JGseCL4JJeGavFQQ_N0UHxwum";


const artistsView =
    document.getElementById("artistsView");

const artistView =
    document.getElementById("artistView");

const releaseView =
    document.getElementById("releaseView");

const artistsGrid =
    document.getElementById("artistsGrid");

const artistsMessage =
    document.getElementById("artistsMessage");

const artistHeader =
    document.getElementById("artistHeader");

const releasesContainer =
    document.getElementById("releasesContainer");

const releaseDetail =
    document.getElementById("releaseDetail");

const searchInput =
    document.getElementById("searchInput");

const backToArtists =
    document.getElementById("backToArtists");

const backToArtist =
    document.getElementById("backToArtist");


let currentArtist = null;


/* =========================
   SUPABASE
========================= */

async function supabaseFetch(path) {

    const response = await fetch(
        SUPABASE_URL + path,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        }
    );

    if (!response.ok) {

        const errorText =
            await response.text();

        throw new Error(
            "Supabase error: " +
            response.status +
            " " +
            errorText
        );
    }

    return await response.json();
}


/* =========================
   SICUREZZA HTML
========================= */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   PLACEHOLDER
========================= */

function placeholderImage(text) {

    return (
        "https://placehold.co/600x600/" +
        "eeeeee/555555?text=" +
        encodeURIComponent(text || "No Image")
    );
}


/* =========================
   DURATA
========================= */

function formatDuration(duration) {

    if (!duration) {
        return "";
    }

    return duration;
}


/* =========================
   DATE
========================= */

function formatReleaseDate(date) {

    if (!date) {
        return "";
    }

    const value = String(date);

    if (/^\d{4}-01-01$/.test(value)) {
        return value.substring(0, 4);
    }

    if (/^\d{4}-\d{2}-01$/.test(value)) {
        return value.substring(0, 7);
    }

    return value;
}


/* =========================
   NORMALIZZA CATEGORIA
========================= */

function normalizeReleaseType(type) {

    const value =
        String(type || "")
            .trim()
            .toLowerCase();

    if (value === "album") {
        return "Album";
    }

    if (
        value === "single" ||
        value === "singolo" ||
        value === "singoli"
    ) {
        return "Singoli";
    }

    if (value === "live") {
        return "Live";
    }

    if (value === "compilation") {
        return "Compilation";
    }

    if (
        value === "ost" ||
        value === "soundtrack" ||
        value === "soundtrack album"
    ) {
        return "OST";
    }

    if (
        value === "remix album" ||
        value === "remix" ||
        value === "remixes"
    ) {
        return "Remix Album";
    }

    return value
        ? String(type)
        : "Album";
}


/* =========================
   CARICAMENTO ARTISTI
========================= */

async function loadArtists() {

    try {

        const artists = await supabaseFetch(
            "/rest/v1/artists" +
            "?select=*" +
            "&order=name.asc"
        );

        renderArtists(artists);

    } catch (error) {

        console.error(error);

        artistsMessage.textContent =
            "Errore nel caricamento degli artisti.";
    }
}


/* =========================
   RENDER ARTISTI
========================= */

function renderArtists(artists) {

    artistsMessage.classList.add("hidden");

    artistsGrid.innerHTML = "";

    if (!artists.length) {

        artistsMessage.textContent =
            "Nessun artista trovato.";

        artistsMessage.classList.remove("hidden");

        return;
    }

    artists.forEach(artist => {

        const card =
            document.createElement("div");

        card.className = "artist-card";

        const image =
            artist.image_url ||
            placeholderImage(artist.name);

        card.innerHTML = `
            <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(artist.name)}"
                loading="lazy"
            >

            <div class="artist-card-info">
                <h3>
                    ${escapeHtml(artist.name)}
                </h3>
            </div>
        `;

        card.addEventListener(
            "click",
            () => showArtist(artist)
        );

        artistsGrid.appendChild(card);
    });
}


/* =========================
   MOSTRA ARTISTA
========================= */

async function showArtist(artist) {

    currentArtist = artist;

    artistsView.classList.add("hidden");

    releaseView.classList.add("hidden");

    artistView.classList.remove("hidden");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    const image =
        artist.image_url ||
        placeholderImage(artist.name);

    artistHeader.innerHTML = `
        <div class="artist-header">

            <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(artist.name)}"
            >

            <div>

                <h2>
                    ${escapeHtml(artist.name)}
                </h2>

                <div class="artist-info">

                    ${
                        artist.country
                        ? `<div><strong>Paese:</strong>
                           ${escapeHtml(artist.country)}</div>`
                        : ""
                    }

                    ${
                        artist.area
                        ? `<div><strong>Area:</strong>
                           ${escapeHtml(artist.area)}</div>`
                        : ""
                    }

                    ${
                        artist.gender
                        ? `<div><strong>Genere:</strong>
                           ${escapeHtml(artist.gender)}</div>`
                        : ""
                    }

                    ${
                        artist.birth_date
                        ? `<div><strong>Nascita:</strong>
                           ${escapeHtml(artist.birth_date)}</div>`
                        : ""
                    }

                    ${
                        artist.birth_place
                        ? `<div><strong>Luogo di nascita:</strong>
                           ${escapeHtml(artist.birth_place)}</div>`
                        : ""
                    }

                    ${
                        artist.disambiguation
                        ? `<div><strong>Info:</strong>
                           ${escapeHtml(artist.disambiguation)}</div>`
                        : ""
                    }

                </div>

            </div>

        </div>
    `;

    releasesContainer.innerHTML =
        `<div class="message">
            Caricamento discografia...
        </div>`;

    try {

        const releases =
            await supabaseFetch(
                "/rest/v1/releases" +
                "?select=*" +
                "&artist_id=eq." +
                encodeURIComponent(artist.id) +
                "&order=release_date.asc.nullslast,title.asc"
            );

        renderReleases(releases);

    } catch (error) {

        console.error(error);

        releasesContainer.innerHTML =
            `<div class="message">
                Errore nel caricamento della discografia.
            </div>`;
    }
}


/* =========================
   RENDER DISCOGRAFIA
========================= */

function renderReleases(releases) {

    releasesContainer.innerHTML = "";

    if (!releases.length) {

        releasesContainer.innerHTML =
            `<div class="message">
                Nessuna release trovata.
            </div>`;

        return;
    }


    const albums = [];

    const singles = [];

    const live = [];

    const compilations = [];

    const ost = [];

    const remixAlbums = [];


    releases.forEach(release => {

        const category =
            normalizeReleaseType(
                release.release_type
            );

        if (category === "Album") {

            albums.push(release);

        } else if (category === "Singoli") {

            singles.push(release);

        } else if (category === "Live") {

            live.push(release);

        } else if (category === "Compilation") {

            compilations.push(release);

        } else if (category === "OST") {

            ost.push(release);

        } else if (category === "Remix Album") {

            remixAlbums.push(release);

        } else {

            albums.push(release);
        }
    });


    renderReleaseSection(
        "Album",
        albums
    );

    renderReleaseSection(
        "Singoli",
        singles
    );

    renderReleaseSection(
        "Live",
        live
    );

    renderReleaseSection(
        "Compilation",
        compilations
    );

    renderReleaseSection(
        "OST",
        ost
    );

    renderReleaseSection(
        "Remix Album",
        remixAlbums
    );
}


/* =========================
   SEZIONE RELEASE
========================= */

function renderReleaseSection(
    title,
    releases
) {

    if (!releases.length) {
        return;
    }

    const section =
        document.createElement("section");

    section.className =
        "release-section";

    const heading =
        document.createElement("h2");

    heading.textContent =
        title;

    section.appendChild(heading);


    const grid =
        document.createElement("div");

    grid.className =
        "releases-grid";


    releases.forEach(release => {

        const card =
            document.createElement("div");

        card.className =
            "release-card";


        const image =
            release.cover_url ||
            placeholderImage(release.title);


        card.innerHTML = `

            <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(release.title)}"
                loading="lazy"
            >

            <div class="release-card-info">

                <h3>
                    ${escapeHtml(release.title)}
                </h3>

                <div class="release-date">
                    ${escapeHtml(
                        formatReleaseDate(
                            release.release_date
                        )
                    )}
                </div>

                <div class="release-type">
                    ${escapeHtml(
                        normalizeReleaseType(
                            release.release_type
                        )
                    )}
                </div>

            </div>
        `;


        card.addEventListener(
            "click",
            () => showRelease(release)
        );


        grid.appendChild(card);
    });


    section.appendChild(grid);

    releasesContainer.appendChild(section);
}


/* =========================
   MOSTRA RELEASE
========================= */

async function showRelease(release) {

    artistView.classList.add("hidden");

    releaseView.classList.remove("hidden");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    const image =
        release.cover_url ||
        placeholderImage(release.title);


    releaseDetail.innerHTML = `

        <div class="release-detail">

            <div class="release-detail-header">

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(release.title)}"
                >

                <div>

                    <h2>
                        ${escapeHtml(release.title)}
                    </h2>

                    <div class="release-meta">

                        <div>
                            <strong>Tipo:</strong>
                            ${escapeHtml(
                                normalizeReleaseType(
                                    release.release_type
                                )
                            )}
                        </div>

                        ${
                            release.release_date
                            ? `
                                <div>
                                    <strong>Data:</strong>
                                    ${escapeHtml(
                                        formatReleaseDate(
                                            release.release_date
                                        )
                                    )}
                                </div>
                            `
                            : ""
                        }

                        ${
                            release.country
                            ? `
                                <div>
                                    <strong>Paese:</strong>
                                    ${escapeHtml(
                                        release.country
                                    )}
                                </div>
                            `
                            : ""
                        }

                        ${
                            release.label
                            ? `
                                <div>
                                    <strong>Label:</strong>
                                    ${escapeHtml(
                                        release.label
                                    )}
                                </div>
                            `
                            : ""
                        }

                        ${
                            release.catalog_number
                            ? `
                                <div>
                                    <strong>Catalogo:</strong>
                                    ${escapeHtml(
                                        release.catalog_number
                                    )}
                                </div>
                            `
                            : ""
                        }

                    </div>

                </div>

            </div>

            <div id="tracklistContainer"
                 class="tracklist">

                <div class="message">
                    Caricamento tracklist...
                </div>

            </div>

        </div>
    `;


    try {

        const tracks =
            await supabaseFetch(
                "/rest/v1/tracks" +
                "?select=*" +
                "&release_id=eq." +
                encodeURIComponent(release.id) +
                "&order=disc_number.asc,track_number.asc"
            );


        renderTracks(tracks);

    } catch (error) {

        console.error(error);

        document.getElementById(
            "tracklistContainer"
        ).innerHTML = `
            <div class="message">
                Errore nel caricamento della tracklist.
            </div>
        `;
    }
}


/* =========================
   TRACKLIST
========================= */

function renderTracks(tracks) {

    const container =
        document.getElementById(
            "tracklistContainer"
        );

    if (!tracks.length) {

        container.innerHTML = `
            <div class="message">
                Nessuna traccia disponibile.
            </div>
        `;

        return;
    }


    let html = `
        <h3>Tracklist</h3>
    `;


    let currentDisc = null;


    tracks.forEach(track => {

        const discNumber =
            track.disc_number || 1;


        if (discNumber !== currentDisc) {

            if (currentDisc !== null) {
                html += `
                    </div>
                `;
            }

            currentDisc =
                discNumber;


            if (
                tracks.some(
                    t =>
                        (t.disc_number || 1) !== 1
                )
            ) {

                html += `
                    <h4>
                        Disc ${escapeHtml(
                            discNumber
                        )}
                    </h4>

                    <div>
                `;
            } else {

                html += `
                    <div>
                `;
            }
        }


        html += `

            <div class="track">

                <div class="track-number">
                    ${escapeHtml(
                        track.track_number || ""
                    )}
                </div>

                <div class="track-title">
                    ${escapeHtml(
                        track.title
                    )}
                </div>

                <div class="track-duration">
                    ${escapeHtml(
                        formatDuration(
                            track.duration
                        )
                    )}
                </div>

            </div>

        `;
    });


    if (currentDisc !== null) {

        html += `
            </div>
        `;
    }


    container.innerHTML =
        html;
}


/* =========================
   RICERCA
========================= */

searchInput.addEventListener(
    "input",
    async function () {

        const query =
            this.value.trim();


        if (!query) {

            loadArtists();

            return;
        }


        try {

            const artists =
                await supabaseFetch(
                    "/rest/v1/artists" +
                    "?select=*" +
                    "&name=ilike.*" +
                    encodeURIComponent(query) +
                    "*&order=name.asc"
                );


            renderArtists(artists);

        } catch (error) {

            console.error(error);

            artistsMessage.textContent =
                "Errore nella ricerca.";

            artistsMessage.classList.remove(
                "hidden"
            );
        }
    }
);


/* =========================
   BACK
========================= */

backToArtists.addEventListener(

        );

        releaseView.classList.add(
            "hidden"
        );

        artistsView.classList.remove(
            "hidden"
        );

        window.scrollTo({

            behavior: "smooth"
        });
    }
);


backToArtist.addEventListener(
    "click",
    function () {

        releaseView.classList.add(

        );

        artistView.classList.remove(

        );

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }
);


/* =========================
   AVVIO
========================= */

loadArtists();

</script>
